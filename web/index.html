<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Hub</title>
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
  <div class="app">
    <!-- ── left rail ── -->
    <aside class="rail">
      <div class="brand"><span class="sq"></span><span class="name">CLAUDE HUB</span></div>
      <div class="acct">
        <div class="ws" id="ws-name">brain workspace</div>
        <div class="plan">Max plan · 4 seats</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="foot">
        <div class="lim"><span>WEEKLY LIMIT</span><span id="wk-pct">—</span></div>
        <div class="track"><i id="wk-bar" style="width:0%"></i></div>
        <div class="whisper"><span class="g" id="voice-dot"></span><span id="voice-lbl">voice core</span></div>
      </div>
    </aside>

    <!-- ── main ── -->
    <div class="main">
      <header class="header">
        <div class="htext">
          <h1 id="view-title">Overview</h1>
          <div class="sub" id="view-sub"></div>
        </div>
        <div class="spacer"></div>
        <div class="search">
          <span class="slash">/</span>
          <input id="search" type="text" placeholder="Search projects, chats, artifacts" />
        </div>
        <button class="btn-primary" id="talk-btn">Talk to Claude Code</button>
      </header>
      <main class="pane" id="pane"><p class="empty">loading…</p></main>
    </div>
  </div>

  <script src="hub.js?v=8"></script>
</body>
</html>
